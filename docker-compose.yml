services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cotador
      POSTGRES_USER: cotador
      POSTGRES_PASSWORD: cotador
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotador"]
      interval: 3s
      retries: 20

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Caixa de e-mail da demonstração (perfil "email"); em produção, IMAP da empresa com senha no .env.
      COLETA_EMAIL_SERVIDOR: email
      COLETA_EMAIL_SENHA: ${COLETA_EMAIL_SENHA:-demonstracao}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORTA:-8000}:8000"
    volumes:
      - dados:/dados

  # Coleta diária das fontes com captura ativa. Fica num perfil à parte para o `docker compose up` padrão não sair
  # baixando de sites de terceiros: `docker compose --profile coleta up` liga.
  agendador:
    build: .
    profiles: ["coleta"]
    # Espera o app terminar as migrações e a carga inicial (a API responde) antes da primeira coleta.
    entrypoint: ["sh", "-c", "until python -c \"import urllib.request; urllib.request.urlopen('http://app:8000/api/fontes')\" 2>/dev/null; do sleep 10; done; cd /app/backend && while true; do python manage.py coletar; python manage.py sincronizar_ans; sleep 86400; done"]
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      app:
        condition: service_started
    volumes:
      - dados:/dados

  # Servidor de e-mail local para demonstrar a captura por e-mail sem caixa real:
  # `docker compose --profile email up`, depois `docker compose exec app python backend/manage.py simular_email`.
  email:
    image: greenmail/standalone:2.1.3
    profiles: ["email"]
    ports:
      - "3025:3025"
      - "3143:3143"

volumes:
  pgdata:
  dados:
