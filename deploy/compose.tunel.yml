# O protótipo completo num servidor com Docker, publicado por um túnel da Cloudflare, com senha (padrão) ou aberto.
# Nenhuma porta é publicada no servidor: só o túnel chega ao Caddy, e só o Caddy chega ao app.
# Cada contêiner tem teto de memória, para um pico de leitura nunca derrubar o servidor; acima do teto, o app e o banco
# usam swap até o memswap_limit. Uso: deploy/subir-com-tunel.sh.
services:
  db:
    mem_limit: 256m
    memswap_limit: 512m

  app:
    ports: !reset []
    environment:
      GUNICORN_WORKERS: "1"
    mem_limit: 900m
    memswap_limit: 2g

  acesso:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      ACESSO_USUARIO: ${ACESSO_USUARIO:-avaliador}
      ACESSO_HASH: ${ACESSO_HASH:-}
    volumes:
      - ./deploy/${ACESSO_CADDYFILE:-Caddyfile.tunel}:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
    mem_limit: 64m

  tunel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://acesso:8080
    depends_on:
      - acesso
    mem_limit: 128m
